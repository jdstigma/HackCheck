<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HackCheck -- Command Center</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    margin: 0;
    background: #0b0d12;
    color: #e6e6e6;
  }
  header {
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 12px 16px;
    background: #14171f;
    border-bottom: 1px solid #262b36;
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 700; letter-spacing: 0.02em; }
  header input {
    background: #1e222c;
    border: 1px solid #33394a;
    color: #e6e6e6;
    padding: 6px 8px;
    border-radius: 4px;
  }
  header input#baseUrl { width: 220px; }
  header input#sinceMinutes { width: 60px; }
  header button {
    background: #3a6ea5;
    border: none;
    color: white;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
  }
  header button:hover { background: #4a7fb5; }
  header label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #9aa0ac; }
  #status { font-size: 12px; color: #6a707c; margin-left: auto; }
  a.topLink { color: #7bb3e8; font-size: 13px; text-decoration: none; }

  #alertBanner {
    display: none;
    background: linear-gradient(90deg, #4a1414, #6a1a1a);
    border-bottom: 1px solid #8a2626;
    color: #ffdada;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
  }
  #alertBanner.show { display: block; }

  main { padding: 16px; }

  .statGrid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }
  .statCard {
    background: #14171f;
    border: 1px solid #262b36;
    border-radius: 8px;
    padding: 12px 14px;
  }
  .statCard .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #6a707c;
  }
  .statCard .value {
    font-size: 26px;
    font-weight: 700;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .statCard .sub {
    font-size: 12px;
    color: #9aa0ac;
    margin-top: 2px;
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  .dot.up { background: #4caf50; }
  .dot.down { background: #6a707c; }
  .dot.alert { background: #ff6a6a; }

  .grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  @media (max-width: 900px) {
    .grid2 { grid-template-columns: 1fr; }
  }

  section {
    background: #14171f;
    border: 1px solid #262b36;
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
  }
  section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #9aa0ac;
    margin: 0 0 10px 0;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1e222c; }
  th { color: #9aa0ac; font-weight: 500; }
  .empty { color: #6a707c; font-size: 13px; padding: 8px 0; }
  .bytes { font-variant-numeric: tabular-nums; }
  .severity-1 { color: #ff6a6a; font-weight: 700; }
  .severity-2 { color: #ffb84d; }
  .severity-3 { color: #9aa0ac; }
  .blocked { color: #ff6a6a; }

  #topologyFrame {
    width: 100%;
    height: 420px;
    border: none;
    border-radius: 6px;
    background: #0b0d12;
  }
</style>
</head>
<body>

<div id="alertBanner"></div>

<header>
  <h1>HACKCHECK COMMAND CENTER</h1>
  <label>Backend <input id="baseUrl" value="" /></label>
  <label>Last <input id="sinceMinutes" type="number" value="60" min="1" /> min</label>
  <button id="refreshBtn">Refresh</button>
  <label><input id="autoRefreshToggle" type="checkbox" checked /> Auto-refresh <input id="autoRefreshSeconds" type="number" value="30" min="5" style="width:50px;" />s</label>
  <button id="exportFlowsBtn">Export flows</button>
  <button id="exportAlertsBtn">Export alerts</button>
  <button id="exportDnsBtn">Export DNS</button>
  <span id="status"></span>
  <a class="topLink" href="/static/topology.html">Full topology graph &rarr;</a>
</header>

<main>
  <div class="statGrid" id="statGrid"></div>

  <section>
    <h2>Network topology</h2>
    <iframe id="topologyFrame" src=""></iframe>
  </section>

  <div class="grid2">
    <section>
      <h2>Top talkers</h2>
      <div id="topTalkers"></div>
    </section>
    <section>
      <h2>Alerts (Suricata)</h2>
      <div id="alerts"></div>
    </section>
  </div>

  <div class="grid2">
    <section>
      <h2>Known devices</h2>
      <div id="devices"></div>
    </section>
    <section>
      <h2>Top DNS domains (Pi-hole)</h2>
      <div id="topDomains"></div>
    </section>
  </div>

  <section>
    <h2>Recent flows</h2>
    <div id="flows"></div>
  </section>
</main>

<script>
const statusEl = document.getElementById('status');
let autoRefreshTimer = null;

function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  const kb = bytes / 1024;
  if (kb < 1024) return kb.toFixed(1) + ' KB';
  const mb = kb / 1024;
  if (mb < 1024) return mb.toFixed(1) + ' MB';
  return (mb / 1024).toFixed(2) + ' GB';
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function currentBaseUrl() {
  return document.getElementById('baseUrl').value.replace(/\/$/, '');
}
function currentSinceMinutes() {
  return document.getElementById('sinceMinutes').value || 60;
}

function renderStatCards({ devices, talkers, alerts, topDomains, flows, ntopngUp }) {
  const criticalCount = alerts.filter(a => a.severity === 1).length;
  const blockedDns = topDomains.reduce((sum, d) => sum + (d.blocked_count || 0), 0);
  const topTalker = talkers[0];

  const cards = [
    { label: 'Devices', value: devices.length, sub: '' },
    {
      label: 'Alerts',
      value: alerts.length,
      sub: criticalCount > 0 ? `${criticalCount} critical` : 'none critical',
      valueColor: criticalCount > 0 ? '#ff6a6a' : undefined,
    },
    { label: 'DNS blocked', value: blockedDns, sub: `of ${topDomains.reduce((s, d) => s + d.query_count, 0)} queries` },
    { label: 'Recent flows', value: flows.length, sub: '' },
    {
      label: 'Top talker',
      value: topTalker ? formatBytes(topTalker.total_bytes) : '--',
      sub: topTalker ? (topTalker.hostname || topTalker.mac_address || 'unknown') : 'no data',
    },
    {
      label: 'ntopng',
      value: ntopngUp ? 'UP' : 'DOWN',
      valueColor: ntopngUp ? '#4caf50' : '#6a707c',
      sub: '',
    },
  ];

  const el = document.getElementById('statGrid');
  el.innerHTML = cards.map(c => `
    <div class="statCard">
      <div class="label">${escapeHtml(c.label)}</div>
      <div class="value" style="${c.valueColor ? `color:${c.valueColor}` : ''}">${escapeHtml(c.value)}</div>
      <div class="sub">${escapeHtml(c.sub)}</div>
    </div>
  `).join('');
}

function renderAlertBanner(alerts) {
  const banner = document.getElementById('alertBanner');
  const critical = alerts.filter(a => a.severity === 1);
  if (critical.length === 0) {
    banner.classList.remove('show');
    return;
  }
  banner.classList.add('show');
  banner.textContent = `${critical.length} critical alert${critical.length === 1 ? '' : 's'}: ${critical[0].signature}` +
    (critical.length > 1 ? ` (+${critical.length - 1} more)` : '');
}

function renderTopTalkers(rows) {
  const el = document.getElementById('topTalkers');
  if (!rows.length) { el.innerHTML = '<div class="empty">No traffic in this window yet.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Device</th><th>MAC</th><th>Total traffic</th></tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${escapeHtml(r.hostname || '(unnamed)')}</td>
            <td>${escapeHtml(r.mac_address || '?')}</td>
            <td class="bytes">${formatBytes(r.total_bytes)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderDevices(rows) {
  const el = document.getElementById('devices');
  if (!rows.length) { el.innerHTML = '<div class="empty">No devices seen yet.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Hostname</th><th>MAC</th><th>Last seen</th></tr></thead>
      <tbody>
        ${rows.map(d => `
          <tr>
            <td>${escapeHtml(d.hostname || '(unnamed)')}</td>
            <td>${escapeHtml(d.mac_address)}</td>
            <td>${escapeHtml(d.last_seen)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderFlows(rows) {
  const el = document.getElementById('flows');
  if (!rows.length) { el.innerHTML = '<div class="empty">No flows in this window yet.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Source</th><th>Destination</th><th>Protocol</th><th>Sent</th><th>Received</th></tr></thead>
      <tbody>
        ${rows.map(f => `
          <tr>
            <td>${escapeHtml(f.timestamp)}</td>
            <td>${escapeHtml(f.src_ip)}</td>
            <td>${escapeHtml(f.dst_ip)}${f.dst_port ? ':' + f.dst_port : ''}</td>
            <td>${escapeHtml(f.protocol || '?')}</td>
            <td class="bytes">${formatBytes(f.bytes_sent)}</td>
            <td class="bytes">${formatBytes(f.bytes_recv)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderAlerts(rows) {
  const el = document.getElementById('alerts');
  if (!rows.length) { el.innerHTML = '<div class="empty">No alerts in this window. (Needs Suricata configured and eve.json flowing.)</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Time</th><th>Sev</th><th>Signature</th><th>Source</th><th>Dest</th></tr></thead>
      <tbody>
        ${rows.map(a => `
          <tr>
            <td>${escapeHtml(a.timestamp)}</td>
            <td class="severity-${a.severity || 3}">${a.severity != null ? escapeHtml(a.severity) : '?'}</td>
            <td>${escapeHtml(a.signature)}</td>
            <td>${escapeHtml(a.src_ip || '?')}</td>
            <td>${escapeHtml(a.dst_ip || '?')}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

function renderTopDomains(rows) {
  const el = document.getElementById('topDomains');
  if (!rows.length) { el.innerHTML = '<div class="empty">No DNS queries in this window. (Needs Pi-hole configured.)</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr><th>Domain</th><th>Queries</th><th>Blocked</th></tr></thead>
      <tbody>
        ${rows.map(d => `
          <tr>
            <td>${escapeHtml(d.domain)}</td>
            <td class="bytes">${escapeHtml(d.query_count)}</td>
            <td class="bytes ${d.blocked_count > 0 ? 'blocked' : ''}">${escapeHtml(d.blocked_count)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

async function fetchJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} returned ${res.status}`);
  return res.json();
}

function exportCsv(path) {
  const baseUrl = currentBaseUrl();
  const since = currentSinceMinutes();
  window.location.href = `${baseUrl}${path}?since_minutes=${since}`;
}

async function refresh() {
  const baseUrl = currentBaseUrl();
  const since = currentSinceMinutes();

  const topologyFrame = document.getElementById('topologyFrame');
  const desiredSrc = '/static/topology.html';
  if (topologyFrame.getAttribute('src') !== desiredSrc) {
    topologyFrame.setAttribute('src', desiredSrc);
  }

  statusEl.textContent = 'Loading...';
  try {
    const [talkers, devices, flows, alerts, topDomains, ntopngStatus] = await Promise.all([
      fetchJson(`${baseUrl}/top-talkers?since_minutes=${since}&limit=10`),
      fetchJson(`${baseUrl}/devices`),
      fetchJson(`${baseUrl}/flows?since_minutes=${since}&limit=50`),
      fetchJson(`${baseUrl}/alerts?since_minutes=${since}&limit=50`),
      fetchJson(`${baseUrl}/dns-top-domains?since_minutes=${since}&limit=15`),
      fetchJson(`${baseUrl}/ntopng/status`).catch(() => ({ active: false })),
    ]);

    renderStatCards({ devices, talkers, alerts, topDomains, flows, ntopngUp: !!ntopngStatus.active });
    renderAlertBanner(alerts);
    renderTopTalkers(talkers);
    renderDevices(devices);
    renderFlows(flows);
    renderAlerts(alerts);
    renderTopDomains(topDomains);

    const now = new Date().toLocaleTimeString();
    statusEl.textContent = `Updated ${now} -- ${devices.length} devices, ${flows.length} flows, ${alerts.length} alerts`;
  } catch (err) {
    statusEl.textContent = `Error: ${err.message}`;
  }
}

function setupAutoRefresh() {
  if (autoRefreshTimer) {
    clearInterval(autoRefreshTimer);
    autoRefreshTimer = null;
  }
  const enabled = document.getElementById('autoRefreshToggle').checked;
  const seconds = parseInt(document.getElementById('autoRefreshSeconds').value, 10) || 30;
  if (enabled) {
    autoRefreshTimer = setInterval(refresh, seconds * 1000);
  }
}

document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('exportFlowsBtn').addEventListener('click', () => exportCsv('/export/flows'));
document.getElementById('exportAlertsBtn').addEventListener('click', () => exportCsv('/export/alerts'));
document.getElementById('exportDnsBtn').addEventListener('click', () => exportCsv('/export/dns-queries'));
document.getElementById('autoRefreshToggle').addEventListener('change', setupAutoRefresh);
document.getElementById('autoRefreshSeconds').addEventListener('change', setupAutoRefresh);

// Default to the page's own origin rather than hardcoding localhost -- this
// page is always served by the backend itself, so window.location.origin is
// always correct, whereas a hardcoded localhost only works when viewing the
// page from a browser running on the Pi itself, not from another device on
// the network (the normal way this gets viewed).
document.getElementById('baseUrl').value = window.location.origin;

refresh();
setupAutoRefresh();
</script>

</body>
</html>
